name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner | lower }}/douyin-tiktok-download-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run migrations in container
        run: |
          docker run --rm \
            -e DTK_DATABASE_URL="${{ secrets.DTK_DATABASE_URL }}" \
            -e DTK_SECRET_KEY="${{ secrets.DTK_SECRET_KEY }}" \
            -e DTK_BIND_HOST=0.0.0.0 \
            -e DTK_BIND_PORT=8000 \
            -e SECURITY_REQUEST_PROXY=public \
            ghcr.io/${{ github.repository_owner | lower }}/douyin-tiktok-download-api:latest \
            /app/.venv/bin/python -m dtk migrate
