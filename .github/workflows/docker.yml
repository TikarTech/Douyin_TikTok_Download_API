name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase owner
        id: vars
        run: |
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner_lc }}/douyin-tiktok-download-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run migrations in container
        run: |
          docker run --rm \
            -e DTK_DATABASE_URL="${{ secrets.DTK_DATABASE_URL }}" \
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/douyin-tiktok-download-api:latest \
            /app/.venv/bin/alembic upgrade head --sql > /tmp/migration.sql && sed -i '/add_retention_policy/d' /tmp/migration.sql && psql "${DTK_DATABASE_URL}" -f /tmp/migration.sql